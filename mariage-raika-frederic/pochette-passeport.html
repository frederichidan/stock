<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pochette passeport</title>
<link rel="stylesheet" href="commun.css">
<link rel="stylesheet" href="passeport.css">
<style>
  /* Dessin d'origine : 210 × 148 mm à plat, plié en deux au milieu.
     Page 1 = extérieur (dos | couverture), page 2 = intérieur. Pour imprimer, utiliser
     impression.html?doc=passeport : 2 pochettes par feuille A4, à 88,5 % (185,9 × 131 mm). */
  @page { size: 210mm 148mm; margin: 0; }
  /* Recto verso avec retournement sur le bord long : l'intérieur s'imprime tête-bêche. */
  @media print { #planches > .page:nth-child(2) { transform: rotate(180deg); } }
</style>
</head>
<body>
<main id="planches"></main>

<script src="infos.js"></script>
<script src="themes.js"></script>
<script src="commun.js"></script>
<script src="passeport.js"></script>
<script>
  document.getElementById("planches").innerHTML = passeport(THEME);
</script>
</body>
</html>
