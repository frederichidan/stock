<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes de table</title>
<link rel="stylesheet" href="commun.css">
<link rel="stylesheet" href="tables.css">
<style>
  /* Une feuille A4 par table, à imprimer à 100 %, recto seul, puis à plier en deux (pli en
     haut). Paramètres d'adresse :
       ?table=5        la feuille de la table 5 seule ;
       ?pdf=1          textes dorés vectorisés pour l'impression en PDF (vectoriserDegrades) ;
       ?capture=1      fond et dessins seuls, sans les textes (illustrations 8K) ;
       ?images=[…]&premier=11   une feuille par image 8K (tables 11, 12…), les textes posés
                       par-dessus en vectoriel : c'est ainsi qu'exporter.js produit les PDF 8K. */
  @page { size: 210mm 297mm; margin: 0; }
  .feuille-8k { position: relative; width: 210mm; height: 297mm; overflow: hidden; break-after: page; }
  .feuille-8k:last-child { break-after: auto; }
  .feuille-8k svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  @media screen { .feuille-8k { margin: 0 auto 10mm; box-shadow: 0 2mm 8mm rgba(28, 16, 54, 0.35); } }
</style>
</head>
<body>
<main id="planches"></main>

<script src="infos.js"></script>
<script src="themes.js"></script>
<script src="commun.js"></script>
<script src="tables.js"></script>
<script>
  const parametres = new URLSearchParams(location.search);
  const numero = Number(parametres.get("table"));
  const images = JSON.parse(parametres.get("images") || "null");
  const premier = Number(parametres.get("premier")) || 1;
  const planches = document.getElementById("planches");
  if (parametres.has("capture")) document.body.classList.add("sans-texte");
  planches.innerHTML = images
    ? images.map((_, i) => chevaletTable(premier + i, INFOS.tables[premier + i - 1])).join("")
    : INFOS.tables[numero - 1] ? chevaletTable(numero, INFOS.tables[numero - 1]) : chevaletsTables();
  // Les textes se mesurent à plat (la mesure des lettres d'une face tournée serait fausse) ;
  // la moitié haute reprend ensuite sa rotation.
  Promise.all([...document.fonts].map((police) => police.load())).then(async () => {
    await document.fonts.ready;
    if (parametres.has("pdf") || images) {
      const PX = 96 / 25.4;
      const [l, h] = FORMAT_CHEVALET.map((v) => v * PX);
      // Feuilles 8K : textes mesurés au zoom de la capture (voir calqueTexte dans commun.js).
      const zoom = images ? (await tailleImage(images[0]))[1] / h : 1;
      planches.style.zoom = zoom;
      document.body.classList.add("sans-rotation");
      vectoriserDegrades(document, zoom);
      if (images) {
        // Feuille 8K : l'image (fond et dessins), puis les textes des deux faces en vectoriel,
        // la face du haut tournée de 180°, dans un même SVG : une image HTML serait calée au
        // pixel CSS entier dans le PDF, pas les textes (voir exemplaire8K dans impression.html).
        await Promise.all([...new Set(images)].map(tailleImage));
        const feuilles = [...planches.querySelectorAll(".chevalet")].map((feuille, i) => {
          const textes = calqueTexte(feuille.querySelector(".moitie.bas .face-table"), zoom);
          return `<section class="feuille-8k">
            <svg viewBox="0 0 ${l} ${h}" aria-hidden="true">
              <image href="${esc(images[i])}" x="0" y="0" width="${l}" height="${h}" preserveAspectRatio="none"/>
              <g transform="translate(0 ${h / 2})">${textes}</g>
              <g transform="rotate(180 ${l / 2} ${h / 4})">${textes}</g>
            </svg></section>`;
        });
        planches.innerHTML = feuilles.join("");
        await Promise.all([...planches.querySelectorAll("image")].map((image) =>
          new Promise((fin) => {
            image.addEventListener("load", fin, { once: true });
            image.addEventListener("error", fin, { once: true });
          })));
      }
      planches.style.zoom = "";
      document.body.classList.remove("sans-rotation");
    }
    window.pagesPretes = true;
  });
</script>
</body>
</html>
