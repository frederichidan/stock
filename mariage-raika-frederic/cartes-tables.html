<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes de table</title>
<link rel="stylesheet" href="commun.css">
<link rel="stylesheet" href="tables.css">
<style>
  /* Une feuille A4 par table, à imprimer à 100 %, recto seul, puis à plier en deux (pli en
     haut). ?table=5 : la feuille de la table 5 seule. ?pdf=1 : textes dorés vectorisés pour
     l'impression en PDF (voir vectoriserDegrades dans commun.js). */
  @page { size: 210mm 297mm; margin: 0; }
</style>
</head>
<body>
<main id="planches"></main>

<script src="infos.js"></script>
<script src="themes.js"></script>
<script src="commun.js"></script>
<script src="tables.js"></script>
<script>
  const parametres = new URLSearchParams(location.search);
  const numero = Number(parametres.get("table"));
  document.getElementById("planches").innerHTML = INFOS.tables[numero - 1]
    ? chevaletTable(numero, INFOS.tables[numero - 1])
    : chevaletsTables();
  // Les textes dorés se vectorisent à plat (la mesure des lettres d'une face tournée serait
  // fausse), puis la moitié haute reprend sa rotation.
  Promise.all([...document.fonts].map((police) => police.load())).then(async () => {
    await document.fonts.ready;
    if (parametres.has("pdf")) {
      document.body.classList.add("sans-rotation");
      vectoriserDegrades(document);
      document.body.classList.remove("sans-rotation");
    }
    window.pagesPretes = true;
  });
</script>
</body>
</html>
