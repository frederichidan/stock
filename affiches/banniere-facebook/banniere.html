<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bannière Facebook RCA</title>
<link href="fonts/fonts.css" rel="stylesheet">
<!--
  Photo de couverture Facebook : 1640 × 624 px (format recommandé).
  Zone sûre mobile (recadrage 16:9 au centre) : x 265 → 1375 px. Le texte reste dans cette zone.
  ?zones=1 affiche les zones de recadrage (contrôle uniquement).
-->
<style>
  :root{ --navy:#0a1747; --royal:#1c3f9e; --yellow:#f5c400; --green:#22a34a; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1640px;height:624px;overflow:hidden;background:var(--navy)}
  .b{position:relative;width:1640px;height:624px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
    background:radial-gradient(55% 90% at 72% 40%, #1c3f9e 0%, transparent 70%), radial-gradient(50% 80% at 0% 100%, #06102f 0%, transparent 70%), var(--navy)}
  .flag{position:absolute;left:0;right:0;bottom:0;height:16px;display:flex}
  .flag i{flex:1}.flag i:nth-child(1){background:var(--green)}.flag i:nth-child(2){background:var(--yellow)}.flag i:nth-child(3){background:var(--royal)}
  .streaks{position:absolute;left:1075px;top:172px;width:280px}
  .player{position:absolute;left:1050px;top:52px;height:500px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
  .crest{position:absolute;left:290px;top:146px;height:296px;filter:drop-shadow(0 14px 26px rgba(0,0,0,.45))}
  .txt{position:absolute;left:560px;top:150px}
  .rc{font-family:Montserrat,sans-serif;font-weight:800;font-size:40px;letter-spacing:12px;text-transform:uppercase}
  .ak{font-family:Anton,sans-serif;font-size:168px;line-height:1;text-transform:uppercase;letter-spacing:3px;margin-top:4px}
  .sv{font-weight:800;font-size:22px;letter-spacing:6px;color:var(--yellow);text-transform:uppercase;margin-top:6px;display:flex;align-items:center;gap:18px}
  .sv i{width:40px;height:3px;background:var(--yellow)}
  .tag{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;font-size:46px;margin-top:22px;white-space:nowrap}
  .tag em{color:var(--yellow)}
  .zone{position:absolute;top:0;bottom:0;border:3px dashed #ff3b3b;pointer-events:none}
</style>
</head>
<body>
<div class="b">
  <svg class="streaks" viewBox="0 0 300 160">
    <g transform="rotate(-9 150 80)">
      <path d="M0 30 L262 24 A6 6 0 0 1 262 36 Z" fill="#f5c400"/>
      <path d="M40 62 L270 58 A4 4 0 0 1 270 66 Z" fill="#ffffff" opacity=".85"/>
      <path d="M10 94 L256 88 A7 7 0 0 1 256 102 Z" fill="#22a34a"/>
      <path d="M60 126 L262 122 A4 4 0 0 1 262 130 Z" fill="#f5c400"/>
    </g>
  </svg>
  <img class="player" src="joueur.png" alt="">
  <img class="crest" src="ecusson.png" alt="Écusson du Rugby Club Akanda">
  <div class="txt">
    <div class="rc">Rugby Club</div>
    <div class="ak">Akanda</div>
    <div class="sv">Sevens<i></i>Akanda · Gabon</div>
    <div class="tag">Plus qu’un club, <em>une famille&nbsp;!</em></div>
  </div>
  <div class="flag"><i></i><i></i><i></i></div>
</div>
<script>
  if (new URLSearchParams(location.search).get('zones'))
    document.querySelector('.b').insertAdjacentHTML('beforeend','<div class="zone" style="left:265px;width:1110px"></div>');
</script>
</body>
</html>
