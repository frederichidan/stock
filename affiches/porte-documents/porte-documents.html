<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Porte-documents RCA</title>
<link href="fonts/fonts.css" rel="stylesheet">
<!--
  Chemise à rabat pour documents A4 — format fermé 220 × 310 mm, rabat (poche) 100 mm.
  Fichier à plat : 440 × 410 mm + 3 mm de fond perdu = 446 × 416 mm.
  ?vue=ext       face extérieure (dos | couverture, rabat sous le dos, imprimé à 180°)
  ?vue=int       face intérieure (intérieur gauche | intérieur droit)
  ?vue=gabarit   face extérieure + traits de coupe / pli (référence imprimeur)
-->
<style>
  @page { size: 446mm 416mm; margin: 0; }
  :root{ --navy:#0a1747; --navy2:#0b1a52; --royal:#1c3f9e; --yellow:#f5c400; --green:#22a34a; --line:rgba(255,255,255,.2); }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:446mm;height:416mm;background:#fff}
  .sheet{position:relative;width:446mm;height:416mm;overflow:hidden;background:#fff;font-family:Inter,sans-serif}
  .trim{position:absolute;left:3mm;top:3mm;width:440mm;height:410mm}
  .abs{position:absolute}
  .navy{background:radial-gradient(70% 45% at 75% 30%, #1c3f9e 0%, transparent 70%), radial-gradient(60% 50% at 0% 100%, #06102f 0%, transparent 70%), var(--navy)}
  .panel{position:absolute;overflow:hidden}
  .anton{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase}
  .serif{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600}
  .flag{display:flex}.flag i{flex:1}
  .flag i:nth-child(1){background:var(--green)}.flag i:nth-child(2){background:var(--yellow)}.flag i:nth-child(3){background:var(--royal)}
  .frame{position:absolute;inset:9mm;border:.4mm solid rgba(245,196,0,.3)}
  svg.streaks{position:absolute}

  /* couverture */
  .front .crest{position:absolute;left:50%;top:44mm;height:118mm;transform:translateX(-50%);filter:drop-shadow(0 3mm 6mm rgba(0,0,0,.45))}
  .front .rc{position:absolute;left:0;right:0;top:174mm;text-align:center;font-family:Montserrat,sans-serif;font-weight:800;font-size:7mm;letter-spacing:3.2mm;color:#fff;text-transform:uppercase}
  .front .ak{position:absolute;left:0;right:0;top:183mm;text-align:center;font-size:40mm;line-height:1;color:#fff;letter-spacing:1mm}
  .front .sv{position:absolute;left:0;right:0;top:229mm;text-align:center;font-size:5mm;font-weight:800;letter-spacing:3mm;color:var(--yellow);text-transform:uppercase}
  .front .sv i{display:inline-block;width:14mm;height:.6mm;background:var(--yellow);vertical-align:middle;margin:0 5mm}
  .front .tag{position:absolute;left:0;right:0;top:248mm;text-align:center;font-size:10mm;color:#fff}
  .front .tag em{color:var(--yellow)}
  .front .top{position:absolute;left:0;right:0;top:20mm;text-align:center;font-size:3.6mm;font-weight:700;letter-spacing:2mm;color:rgba(255,255,255,.75);text-transform:uppercase}

  /* dos */
  .back .name small,.back .values span,.back .contact .t,.back .contact li small{color:#fff !important}
  .back .values div,.back .contact{border-color:rgba(255,255,255,.25) !important}
  .back .crest{position:absolute;left:50%;top:34mm;height:56mm;transform:translateX(-50%)}
  .back .name{position:absolute;left:0;right:0;top:92mm;text-align:center}
  .back .name b{display:block;font-family:Anton;font-weight:400;font-size:13mm;letter-spacing:.6mm;color:#fff;text-transform:uppercase}
  .back .name small{display:block;margin-top:2mm;font-size:4mm;font-weight:800;letter-spacing:2mm;color:var(--yellow);text-transform:uppercase}
  .back .values{position:absolute;left:24mm;right:24mm;top:138mm;display:grid;grid-template-columns:1fr 1fr;gap:4mm 6mm}
  .back .values div{border-top:.4mm solid var(--line);padding-top:3mm}
  .back .values span{display:block;font-size:3mm;font-weight:700;letter-spacing:1.4mm;color:var(--yellow)}
  .back .values b{display:block;font-family:Anton;font-weight:400;font-size:9mm;color:#fff;text-transform:uppercase;letter-spacing:.3mm;margin-top:1mm}
  .back .contact{position:absolute;left:24mm;right:24mm;top:200mm;border-top:.4mm solid var(--line);padding-top:6mm;text-align:center}
  .back .contact .t{font-size:3.6mm;font-weight:800;letter-spacing:2mm;color:var(--yellow);text-transform:uppercase}
  .back .contact ul{list-style:none;margin-top:3mm}
  .back .contact li{font-family:Anton;font-size:9mm;color:#fff;letter-spacing:.4mm;line-height:1.25}
  .back .contact li small{font-family:Inter;font-weight:700;font-size:3.6mm;color:var(--yellow);margin-right:2mm;vertical-align:1.2mm}
  .back .contact .loc{margin-top:4mm;font-size:3.6mm;font-weight:600;letter-spacing:1.2mm;color:rgba(255,255,255,.85);text-transform:uppercase}

  /* rabat (poche) */
  .flap .in{position:absolute;inset:0;display:flex;align-items:center;gap:8mm;padding:0 18mm}
  .flap img{height:62mm;flex:none;filter:drop-shadow(0 2mm 4mm rgba(0,0,0,.4))}
  .flap .txt b{display:block;font-family:Anton;font-weight:400;font-size:15mm;line-height:1;color:#fff;text-transform:uppercase;letter-spacing:.5mm}
  .flap .txt span{display:block;font-family:Montserrat;font-weight:800;font-size:4.2mm;letter-spacing:2.2mm;color:var(--yellow);text-transform:uppercase;margin-top:2.5mm}
  .flap .txt em{display:block;font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;font-size:7mm;color:#fff;margin-top:3mm}

  /* intérieur */
  .inner{background:#fff}
  .inner .head{position:absolute;left:0;right:0;top:0;height:22mm;background:var(--navy);display:flex;align-items:center;padding:0 16mm;gap:5mm}
  .inner .head img{height:14mm}
  .inner .head b{font-family:Montserrat;font-weight:800;font-size:4mm;letter-spacing:1.8mm;color:#fff;text-transform:uppercase}
  .inner .head span{margin-left:auto;font-weight:800;font-size:3.4mm;letter-spacing:1.6mm;color:var(--yellow);text-transform:uppercase}
  .inner .wm{position:absolute;opacity:.06}
  .inner .q{position:absolute;left:18mm;right:18mm;top:120mm}
  .inner .q .k{font-size:3.6mm;font-weight:800;letter-spacing:2mm;color:var(--green);text-transform:uppercase}
  .inner .q h2{font-family:Anton;font-weight:400;font-size:20mm;line-height:1.05;color:var(--navy);text-transform:uppercase;margin-top:3mm}
  .inner .q h2 em{font-style:normal;color:var(--yellow);-webkit-text-stroke:.25mm var(--navy)}
  .inner .q p{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;font-size:8mm;color:var(--navy);margin-top:5mm;line-height:1.2}
  .inner .vals{position:absolute;left:18mm;right:18mm;bottom:22mm;display:grid;grid-template-columns:repeat(4,1fr);gap:4mm}
  .inner .vals div{border-top:.6mm solid var(--navy);padding-top:2.5mm}
  .inner .vals span{display:block;font-size:2.8mm;font-weight:800;letter-spacing:1mm;color:var(--green)}
  .inner .vals b{display:block;font-family:Anton;font-weight:400;font-size:6.2mm;color:var(--navy);text-transform:uppercase;margin-top:1mm}
  .inner .note{position:absolute;left:18mm;right:18mm;top:40mm;font-size:3.4mm;font-weight:800;letter-spacing:1.6mm;color:#8a93b0;text-transform:uppercase}

  /* gabarit */
  .cut{position:absolute;border:0 solid #e3001b}
  .fold{position:absolute;border:0 dashed #0091ff}
  .lbl{position:absolute;font:700 4mm Inter;color:#e3001b;background:#fff;padding:.5mm 1.5mm;border-radius:1mm;letter-spacing:.3mm}
  .lbl.b{color:#0091ff}
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>

<script>
const vue = new URLSearchParams(location.search).get('vue') || 'ext';
const sheet = document.getElementById('sheet');

const streaks = (x,y,w,rot,op=1) => `
  <svg class="streaks" style="left:${x}mm;top:${y}mm;width:${w}mm;opacity:${op}" viewBox="0 0 300 160">
    <g transform="rotate(${rot} 150 80)">
      <path d="M0 30 L262 24 A6 6 0 0 1 262 36 Z" fill="#f5c400"/>
      <path d="M40 62 L270 58 A4 4 0 0 1 270 66 Z" fill="#ffffff" opacity=".85"/>
      <path d="M10 94 L256 88 A7 7 0 0 1 256 102 Z" fill="#22a34a"/>
      <path d="M60 126 L262 122 A4 4 0 0 1 262 130 Z" fill="#f5c400"/>
    </g></svg>`;

const PHONES = ['077 05 44 13','074 85 69 48','074 91 40 12'];

function exterior(){
  return `
  <!-- fonds (avec 3 mm de fond perdu) -->
  <div class="abs navy" style="left:-3mm;top:-3mm;width:446mm;height:316mm"></div>
  <div class="abs navy" style="left:-3mm;top:310mm;width:226mm;height:103mm"></div>
  <!-- dos : aplat de couleur unique (bleu marine), sans dégradé ni bande -->
  <div class="abs" style="left:-3mm;top:-3mm;width:223mm;height:313mm;background:var(--navy)"></div>
  <div class="abs flag" style="left:220mm;top:300mm;width:223mm;height:10mm"><i></i><i></i><i></i></div>

  <!-- DOS (gauche) -->
  <div class="panel back" style="left:0;top:0;width:220mm;height:310mm">
    <img class="crest" src="ecusson.png">
    <div class="name"><b>Rugby Club Akanda</b><small>Sevens</small></div>
    <div class="values">
      <div><span>01</span><b>Courage</b></div><div><span>02</span><b>Engagement</b></div>
      <div><span>03</span><b>Solidarité</b></div><div><span>04</span><b>Dépassement</b></div>
    </div>
    <div class="contact">
      <div class="t">Contacts</div>
      <ul>${PHONES.map(p=>`<li><small>+241</small>${p}</li>`).join('')}</ul>
      <div class="loc">Akanda — Gabon</div>
    </div>
  </div>

  <!-- COUVERTURE (droite) -->
  <div class="panel front" style="left:220mm;top:0;width:220mm;height:300mm">
    <div class="frame" style="bottom:0"></div>
    ${streaks(-10,62,150,-9)}
    <div class="top">Porte-documents officiel</div>
    <img class="crest" src="ecusson-8k.png">
    <div class="rc">Rugby Club</div>
    <div class="ak anton">Akanda</div>
    <div class="sv"><i></i>Sevens<i></i></div>
    <div class="tag serif">Plus qu’un club, <em>une famille&nbsp;!</em></div>
  </div>

  <!-- RABAT / POCHE (sous le dos, imprimé à 180° : il se lit à l'endroit une fois replié) -->
  <div class="panel flap" style="left:0;top:310mm;width:220mm;height:100mm;transform:rotate(180deg)">
    <div class="in">
      <img src="ecusson.png">
      <div class="txt"><b>Rugby Club<br>Akanda</b><span>Sevens</span><em>Plus qu’un club, une famille&nbsp;!</em></div>
    </div>
  </div>`;
}

function interior(){
  // vu de l'intérieur : gauche = verso de la couverture, droite = verso du dos (reçoit la poche)
  return `
  <div class="abs" style="left:-3mm;top:-3mm;width:446mm;height:419mm;background:#fff"></div>
  <!-- bandeaux -->
  <div class="panel inner" style="left:0;top:-3mm;width:220mm;height:313mm">
    <div class="head" style="top:0;height:25mm;padding-top:3mm"><img src="ecusson.png"><b>Rugby Club Akanda</b><span>Sevens</span></div>
    <img class="wm" src="ecusson-8k.png" style="left:30mm;top:62mm;height:190mm">
    <div class="q">
      <div class="k">Bienvenue au club</div>
      <h2>Plus qu’un club,<br><em>une famille&nbsp;!</em></h2>
      <p>Courage, engagement, solidarité et dépassement&nbsp;: ensemble, sur le terrain comme en dehors.</p>
    </div>
    <div class="vals">
      <div><span>01</span><b>Courage</b></div><div><span>02</span><b>Engagement</b></div>
      <div><span>03</span><b>Solidarité</b></div><div><span>04</span><b>Dépassement</b></div>
    </div>
  </div>
  <div class="panel inner" style="left:220mm;top:-3mm;width:223mm;height:313mm">
    <div class="head" style="top:0;height:25mm;padding-top:3mm;padding-right:19mm"><b>Documents</b><span>Saison sportive</span></div>
    ${streaks(40,70,170,-9,.12)}
    <div class="note" style="top:46mm">Rugby Club Akanda · Akanda — Gabon</div>
  </div>
  <div class="abs flag" style="left:-3mm;top:300mm;width:223mm;height:10mm"><i></i><i></i><i></i></div>
  <div class="abs flag" style="left:220mm;top:300mm;width:223mm;height:10mm"><i></i><i></i><i></i></div>`;
}

function gabarit(){
  return exterior() + `
  <div class="abs" style="inset:-3mm;background:rgba(255,255,255,.55)"></div>
  <!-- coupe (rouge) -->
  <div class="cut" style="left:0;top:0;width:440mm;height:0;border-top-width:.6mm"></div>
  <div class="cut" style="left:0;top:0;width:0;height:410mm;border-left-width:.6mm"></div>
  <div class="cut" style="left:440mm;top:0;width:0;height:310mm;border-left-width:.6mm"></div>
  <div class="cut" style="left:220mm;top:310mm;width:220mm;height:0;border-top-width:.6mm"></div>
  <div class="cut" style="left:220mm;top:310mm;width:0;height:100mm;border-left-width:.6mm"></div>
  <div class="cut" style="left:0;top:410mm;width:220mm;height:0;border-top-width:.6mm"></div>
  <!-- plis (bleu) -->
  <div class="fold" style="left:220mm;top:0;width:0;height:310mm;border-left-width:.6mm"></div>
  <div class="fold" style="left:0;top:310mm;width:220mm;height:0;border-top-width:.6mm"></div>
  <!-- fond perdu -->
  <div class="abs" style="left:-3mm;top:-3mm;width:446mm;height:416mm;outline:.3mm dotted #999;outline-offset:-.15mm"></div>
  <div class="lbl" style="left:60mm;top:140mm">DOS — 220 × 310 mm</div>
  <div class="lbl" style="left:282mm;top:140mm">COUVERTURE — 220 × 310 mm</div>
  <div class="lbl b" style="left:200mm;top:250mm;transform:rotate(-90deg);transform-origin:left top">PLI</div>
  <div class="lbl" style="left:40mm;top:355mm">RABAT / POCHE — 220 × 100 mm (imprimé à 180°)</div>
  <div class="lbl b" style="left:90mm;top:306mm">PLI DU RABAT</div>
  <div class="lbl" style="left:265mm;top:355mm;color:#666">Zone découpée (chute)</div>
  <div class="lbl" style="left:8mm;top:8mm;color:#333">Format à plat 440 × 410 mm + fond perdu 3 mm · Coupe en rouge · Plis en bleu pointillé</div>`;
}

const html = {ext:exterior, int:interior, gabarit:gabarit}[vue]();
sheet.innerHTML = `<div class="trim">${html}</div>`;
if(vue==='gabarit'){ document.querySelectorAll('.navy').forEach(e=>e.style.opacity=1); }
</script>
</body>
</html>
